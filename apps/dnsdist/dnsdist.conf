-- dnsdist — the cluster's DNS front door behind the MetalLB VIP (192.168.52.53).
--
-- Data path:  UDM clients -> 192.168.52.53:53 (MetalLB L2 VIP) -> dnsdist
--             -> Pi-hole per-ordinal Services (10.43.100.31-33) -> unbound/upstream.
--
-- Fallback:   the public resolvers in the "backup" pool are used ONLY when every
--             Pi-hole pod is down. In normal operation 100% of queries go to
--             Pi-hole, so there is no ad-block bypass; the backup pool is purely
--             a last-ditch "the cluster's DNS is fully down" safety net.

-- Listen for DNS on all pod interfaces (UDP + TCP) on port 53.
setLocal("0.0.0.0:53")

-- Three per-ordinal Pi-hole backends. Each ClusterIP routes to exactly one
-- Pi-hole pod via the statefulset.kubernetes.io/pod-name selector, so dnsdist
-- health-checks each pod independently. A single corrupt or wedged pod no longer
-- impairs the shared VIP.
--
-- Health check: version.bind. TXT CH is answered locally by FTL with no upstream
-- or gravity dependency. This proves FTL is actively servicing DNS on that pod.
-- mustResolve=true requires NOERROR (not NXDOMAIN/SERVFAIL/REFUSED).
-- checkClass=DNSClass.CHAOS (class 3) is confirmed available in dnsdist 1.9.12
-- (docs reference/constants.rst, commit 0189ba2d, tag dnsdist-1.9.12).
newServer({
  address = "10.43.100.31:53",
  pool = "pihole",
  name = "pihole-0",
  checkName = "version.bind.",
  checkType = "TXT",
  checkClass = DNSClass.CHAOS,
  mustResolve = true,
  checkInterval = 2,
  maxCheckFailures = 2,
})
newServer({
  address = "10.43.100.32:53",
  pool = "pihole",
  name = "pihole-1",
  checkName = "version.bind.",
  checkType = "TXT",
  checkClass = DNSClass.CHAOS,
  mustResolve = true,
  checkInterval = 2,
  maxCheckFailures = 2,
})
newServer({
  address = "10.43.100.33:53",
  pool = "pihole",
  name = "pihole-2",
  checkName = "version.bind.",
  checkType = "TXT",
  checkClass = DNSClass.CHAOS,
  mustResolve = true,
  checkInterval = 2,
  maxCheckFailures = 2,
})

-- Last-ditch public resolvers (only reached when no Pi-hole server is up).
newServer({ address = "1.1.1.1:53", pool = "backup", name = "cloudflare", checkInterval = 5 })
newServer({ address = "8.8.8.8:53", pool = "backup", name = "google",     checkInterval = 5 })

-- Route to Pi-hole while any Pi-hole server is healthy; otherwise fall back to
-- the public resolvers.
addAction(AllRule(), LuaAction(function(dq)
  for _, srv in ipairs(getPoolServers("pihole")) do
    if srv:isUp() then
      return DNSAction.Pool, "pihole"
    end
  end
  return DNSAction.Pool, "backup"
end))
